name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # `go vet` says nothing about formatting. This check deliberately prints
      # offenders because `gofmt -l` alone exits successfully even when files
      # need formatting; that once let an unformatted test stay in green builds.
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || {
            echo 'not gofmt-clean:'
            gofmt -l .
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      # The `lark` tag guards the Feishu SDK so it stays out of signed release
      # binaries. CI exercises the tagged path so it cannot rot unnoticed.
      - name: Build with lark tag
        run: go build -tags lark ./...

      - name: Test with lark tag
        run: go test -tags lark ./...

      - name: Vet with lark tag
        run: go vet -tags lark ./...

      # Every platform a release ships, built the way build-release.sh builds
      # it — including the three Android targets that link through the NDK
      # (present on GitHub's Ubuntu image as ANDROID_NDK_LATEST_HOME). Android's
      # build-tagged DNS implementation is invisible to every other target, and
      # 32-bit targets have their own ways to break (int width, atomic
      # alignment), so a target that stopped compiling is caught here rather
      # than at the tag.
      - name: Cross-compile every release target
        run: ./scripts/cross-compile.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # GitHub-hosted Ubuntu runners provide the Docker daemon needed to build,
      # smoke-test, inventory, and scan the production image.
      - name: Run supply-chain scans
        run: ./scripts/security-scan.sh all

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wanctl-sbom
          path: artifacts/wanctl.sbom.cdx.json
          retention-days: 30
          if-no-files-found: warn
