<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- wanctl 的标记：一个 w，最后一笔越过其余三笔的顶。
       一眼是字母，看清了是「一条路走完，末尾抬起来」—— 那一下就是勾。
       产品的核心动作是你点头（不是上锁，也不是一个 >_ 提示符）。

       字母画成路径而不是 <text>：favicon 的 SVG 由浏览器独立渲染，拿不到页面的
       @font-face，用 <text> 会掉到各平台自己的系统字体上，同一个标记在三个操作
       系统上长三个样。

       方框版把路径下移 1.3 做几何居中（圆头把墨迹上下撑得不对称）；
       页面里内嵌的那份不移，那样它跟字标的视觉基线才对得上。 -->
  <rect width="32" height="32" rx="7" fill="#1d1d1f"/>
  <g transform="translate(0 1.3)">
    <path d="M5.6 12.4 10.2 21.8 15.2 14.6 19.6 21.8 26.4 7.6"
          fill="none" stroke="#ffffff" stroke-width="3.1"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
