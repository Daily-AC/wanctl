<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wanctl · team portal</title>
<style>
  :root{
    --bg:#0f1216;--panel:#171b21;--panel2:#1d232b;--line:#2a323c;
    --ink:#e8edf2;--dim:#8b97a6;--accent:#5db0ff;--ok:#39d98a;--warn:#ffb454;--bad:#ff6b6b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .logo{width:26px;height:26px;color:var(--accent)}
  header h1{font-size:15px;font-weight:650;margin:0;letter-spacing:.3px}
  header .me{margin-left:auto;color:var(--dim);font-size:12.5px;font-family:var(--mono)}
  header .me b{color:var(--ink)}
  main{max-width:980px;margin:0 auto;padding:22px;display:grid;gap:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card>h2{margin:0;padding:13px 18px;font-size:12.5px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card>h2 svg{width:15px;height:15px}
  .body{padding:14px 18px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--mono)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  tr:last-child td{border-bottom:none}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  input,select{font:13px var(--mono);background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:8px}
  input{flex:1;min-width:120px}
  button{font:600 13px inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:rgba(93,176,255,.14);border-color:transparent;color:var(--accent)}
  .rm{color:var(--dim);cursor:pointer;border:none;background:none}
  .rm:hover{color:var(--bad)}
  .revoked{opacity:.5;text-decoration:line-through}
  .tokenbox{margin-top:12px;background:#10241a;border:1px solid var(--ok);border-radius:8px;padding:12px 14px;display:none}
  .tokenbox code{font-family:var(--mono);color:var(--ok);word-break:break-all;font-size:13px}
  .tokenbox .note{color:var(--dim);font-size:12px;margin-top:6px}
  .err{background:#2a1416;border:1px solid var(--bad);color:#ffd2d2;padding:12px 16px;border-radius:10px;margin-bottom:14px;display:none;font-size:13px}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 4 6v6c0 4.4 3.4 8 8 10 4.6-2 8-5.6 8-10V6l-8-4Z"/><path d="m9 12 2 2 4-4"/></svg>
  <h1>wanctl team portal</h1>
  <div class="me" id="me">…</div>
</header>
<main>
  <div class="err" id="err"></div>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>Access tokens</h2>
    <div class="body">
      <table id="tokens"><thead><tr><th>id</th><th>label</th><th>created</th><th>expires</th><th>status</th><th></th></tr></thead><tbody></tbody></table>
      <div class="row">
        <input id="tlabel" placeholder="label (e.g. laptop, ci)">
        <input id="tdays" type="number" min="0" placeholder="expires in N days (0 = never)" style="max-width:240px">
        <button class="primary" id="tissue">Issue token</button>
      </div>
      <div class="tokenbox" id="tokenbox"><code id="tokenval"></code><div class="note">Copy it now — it is shown only once. Set it as WANCTL_TOKEN on the controller.</div></div>
    </div>
  </section>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>My devices</h2>
    <div class="body"><table id="devices"><thead><tr><th>name</th><th>fingerprint</th><th>last seen</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 11a4 4 0 1 0-8 0M2 21a8 8 0 0 1 20 0"/></svg>Shared access (ACL)</h2>
    <div class="body">
      <table id="acl"><thead><tr><th>id</th><th>device</th><th>grantee namespace</th><th>perms</th><th></th></tr></thead><tbody></tbody></table>
      <div class="row">
        <input id="adev" placeholder="device name">
        <input id="agrantee" placeholder="grantee namespace">
        <input id="aperms" placeholder="perms (exec,read,write)" style="max-width:220px">
        <button id="aadd">Grant</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Relay audit (last 100)</h2>
    <div class="body"><table id="audit"><thead><tr><th>time</th><th>device</th><th>event</th></tr></thead><tbody></tbody></table></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
function esc(s){return (''+(s??'')).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function showErr(m){const e=$('#err');e.textContent=m;e.style.display='block'}
function fmt(t){return t?new Date(t).toLocaleString():'—'}

async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(await r.text());return r.json()}
async function jpost(u,b){const r=await fetch(u,{method:'POST',body:JSON.stringify(b||{})});if(!r.ok)throw new Error(await r.text());return r}

async function loadMe(){
  try{const m=await jget('/api/me');$('#me').innerHTML=`namespace <b>${esc(m.namespace)}</b> · ${esc(m.identity)}`}
  catch(e){showErr('Not signed in: '+e.message+'  (open /whoami to find the SSO header)')}
}
async function loadTokens(){
  const d=await jget('/api/tokens');const tb=$('#tokens tbody');const ts=d.tokens||[];
  tb.innerHTML=ts.length?ts.map(t=>{
    const revoked=!!t.revoked_at;const exp=t.expires_at?fmt(t.expires_at):'never';
    const status=revoked?'revoked':'active';
    return `<tr class="${revoked?'revoked':''}"><td>${t.id}</td><td>${esc(t.label)}</td><td>${fmt(t.created_at)}</td><td>${exp}</td><td>${status}</td>
      <td>${revoked?'':`<button class="rm" onclick="revokeToken(${t.id})">revoke</button>`}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">No tokens yet.</td></tr>';
}
async function loadDevices(){
  const d=await jget('/api/devices');const tb=$('#devices tbody');const xs=d.devices||[];
  tb.innerHTML=xs.length?xs.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc((x.fingerprint||'').slice(0,28))}</td><td>${fmt(x.last_seen)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">No devices recorded yet.</td></tr>';
}
async function loadACL(){
  const d=await jget('/api/acl');const tb=$('#acl tbody');const xs=d.acl||[];
  tb.innerHTML=xs.length?xs.map(x=>`<tr><td>${x.id}</td><td>${esc(x.device)}</td><td>${esc(x.grantee)}</td><td>${esc(x.perms)}</td>
     <td><button class="rm" onclick="revokeACL(${x.id})">revoke</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No grants.</td></tr>';
}
async function loadAudit(){
  const d=await jget('/api/audit');const tb=$('#audit tbody');const xs=d.audit||[];
  tb.innerHTML=xs.length?xs.map(x=>`<tr><td>${fmt(x.ts)}</td><td>${esc(x.device)}</td><td>${esc(x.event)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">No activity.</td></tr>';
}
async function revokeToken(id){await jpost('/api/tokens/revoke',{id});loadTokens()}
async function revokeACL(id){await jpost('/api/acl/revoke',{id});loadACL()}
$('#tissue').onclick=async()=>{
  try{
    const label=$('#tlabel').value.trim();const days=parseInt($('#tdays').value||'0',10)||0;
    const r=await jpost('/api/tokens',{label,days});const j=await r.json();
    $('#tokenval').textContent=j.token;$('#tokenbox').style.display='block';
    $('#tlabel').value='';$('#tdays').value='';loadTokens();
  }catch(e){showErr(e.message)}
};
$('#aadd').onclick=async()=>{
  try{await jpost('/api/acl',{device:$('#adev').value.trim(),grantee:$('#agrantee').value.trim(),perms:$('#aperms').value.trim()});
    $('#adev').value='';$('#agrantee').value='';$('#aperms').value='';loadACL();
  }catch(e){showErr(e.message)}
};
loadMe();loadTokens();loadDevices();loadACL();loadAudit();
</script>
</body>
</html>
