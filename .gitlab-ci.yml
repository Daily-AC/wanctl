stages:
  - test
  - security
  - release

variables:
  GOTOOLCHAIN: go1.25.12

# Two runners accept this project's untagged jobs: the project's own shell
# runner (Go and Docker installed on the host) and a group runner using a Docker
# executor whose default image is alpine. Whichever picked up a job first
# decided whether it passed, so `go: not found` failures came and went at
# random — including on a merge request that was merged anyway.
#
# Pinning an image fixes it for either runner: the Docker executor gets a Go
# toolchain, and a shell runner ignores `image` and uses the host's Go, which is
# the same version.
.go:
  image: golang:1.25.12

test:
  extends: .go
  stage: test
  script:
    - go test ./...
    - go vet ./...
    - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

# Needs both a Docker daemon (builds and scans the image) and Go
# (govulncheck), so it runs on the Go image with a dind sidecar rather than
# depending on a specific machine having both installed.
supply-chain:
  extends: .go
  stage: security
  tags: [ai-native]
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io
    - docker info >/dev/null
  script:
    - ./scripts/security-scan.sh all
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/wanctl.sbom.cdx.json

release:
  extends: .go
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - test -n "$WANCTL_RELEASE_SIGNING_KEY" || { echo 'protected WANCTL_RELEASE_SIGNING_KEY is required' >&2; exit 1; }
    - test -n "$WANCTL_RELEASE_RSA_KEY" || { echo 'protected WANCTL_RELEASE_RSA_KEY is required' >&2; exit 1; }
    - ./scripts/build-release.sh "$CI_COMMIT_TAG"
  artifacts:
    name: "wanctl-$CI_COMMIT_TAG"
    paths: [release/]
    expire_in: never
  environment:
    name: release
