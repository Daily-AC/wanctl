stages:
  - test
  - security
  # The APK is built one stage ahead of the release it belongs to, because the
  # manifest has to hash it and because `needs` on this GitLab only accepts a
  # job from a prior stage.
  - package
  - release
  - deploy

variables:
  GOTOOLCHAIN: go1.25.12

# Two runners accept this project's untagged jobs: the project's own shell
# runner (Go and Docker installed on the host) and a group runner using a Docker
# executor whose default image is alpine. Whichever picked up a job first
# decided whether it passed, so `go: not found` failures came and went at
# random — including on a merge request that was merged anyway.
#
# Pinning an image fixes it for either runner: the Docker executor gets a Go
# toolchain, and a shell runner ignores `image` and uses the host's Go, which is
# the same version.
.go:
  image: golang:1.25.12

test:
  extends: .go
  stage: test
  script:
    - go test ./...
    - go vet ./...
    # The `lark` tag guards the Feishu SDK so it stays out of the signed release
    # binary (see docs/superpowers/specs/2026-07-30-lark-approval.md). Only the
    # Docker image builds with it, so without these two lines the tagged path
    # would rot unnoticed until a deploy failed.
    - go build -tags lark ./...
    - go test -tags lark ./...
    - go vet -tags lark ./...
    - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
    # Android is a release target but nothing else in CI compiles it, and its
    # build-tagged file (internal/androiddns/install_android.go) is invisible to
    # every other platform's build — so a break there would only surface when
    # cutting a release.
    - CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./...

# Needs both a Docker daemon (builds and scans the image) and Go
# (govulncheck), which no container image gives us and which the group runner
# cannot provide either — it refuses privileged containers, so a dind sidecar
# dies with "mount: permission denied". Runs instead on a dedicated runner with
# both installed on the host, so no privileged access is needed anywhere.
supply-chain:
  stage: security
  tags: [wanctl-docker]
  variables:
    # That runner sits on a network where proxy.golang.org is unreachable, which
    # failed the image build at `go mod download`.
    GOPROXY: https://goproxy.cn,direct
    # Trivy's default DB origin (mirror.gcr.io / ghcr.io) is unreachable from
    # this runner too; Docker Hub is, via the host's registry mirror.
    TRIVY_DB_REPOSITORY: mirror.ccs.tencentyun.com/aquasec/trivy-db:2
    TRIVY_JAVA_DB_REPOSITORY: mirror.ccs.tencentyun.com/aquasec/trivy-java-db:1
  script:
    - ./scripts/security-scan.sh all
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/wanctl.sbom.cdx.json

# The Android APK is built separately because it needs the Android SDK, which
# the golang image does not have and which is far too large to install per job.
#
# It runs on the dedicated shell runner rather than in a container: that host
# already carries Go and Docker for the supply-chain job, so adding a JDK plus
# `sdkmanager` there is a one-time setup under our control — whereas pulling a
# multi-gigabyte Android image would put the release behind exactly the kind of
# registry reachability that has bitten this pipeline before (see the GOPROXY
# and TRIVY_DB_REPOSITORY overrides above).
#
# The host setup is done (2026-08-07, runner `ls-tencent-wanctl`): OpenJDK 17
# from apt, the SDK's cmdline-tools under /opt/android-sdk, and
#   sdkmanager "platforms;android-36.1" "build-tools;36.1.0"
# — the same pair the on-device acceptance build used, because build-apk.sh
# takes the newest of each and a different android.jar is a different compile
# target. ANDROID_HOME and JAVA_HOME are set in the runner's own `environment`
# in /etc/gitlab-runner/config.toml rather than a profile script, so they do not
# depend on whether the executor happens to start a login shell.
#
# Verified on that host by building a signed APK from this tree end to end
# (aapt2 → javac → d8 → zipalign → apksigner verify, 32s, both post-build
# assertions passing). If the SDK ever goes missing, scripts/build-apk.sh names
# the piece that is gone rather than failing opaquely; the fallback is to build
# the APK locally, attach it at build/android/, and re-run `release`, which
# picks up a staged APK instead of building one.
package:apk:
  stage: package
  tags: [wanctl-docker]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  # Every variable this job needs — both keystore variables and the release
  # signing key — is scoped to the `release` environment, so without this block
  # the job sees none of them and fails its own preflight on the first line.
  # `prepare` rather than the default `start`: this builds an input to the
  # release, it does not deploy anything, and a deployment record here would
  # make the environment's history read as if the APK job were the deploy.
  environment:
    name: release
    action: prepare
  variables:
    GOPROXY: https://goproxy.cn,direct
  script:
    - test -n "$WANCTL_ANDROID_KEYSTORE_B64" || { echo 'protected WANCTL_ANDROID_KEYSTORE_B64 is required; a debug-signed APK cannot be distributed' >&2; exit 1; }
    - test -n "$WANCTL_ANDROID_KEYSTORE_PASS" || { echo 'protected WANCTL_ANDROID_KEYSTORE_PASS is required' >&2; exit 1; }
    # Not for signing the release — for baking the trust anchors into the binary
    # inside the APK, which is what lets it verify the *next* release. The
    # script derives the public keys from it and refuses to build a tagged
    # version without them.
    - test -n "$WANCTL_RELEASE_SIGNING_KEY" || { echo 'protected WANCTL_RELEASE_SIGNING_KEY is required to derive the trust anchors' >&2; exit 1; }
    - ./scripts/build-apk.sh "$CI_COMMIT_TAG"
  artifacts:
    paths: [build/android/wanctl-android-arm64.apk]
    expire_in: 1 day

release:
  extends: .go
  stage: release
  # The manifest has to hash the APK, so it cannot be created until the APK
  # exists. build-release.sh refuses to produce a release without one unless
  # WANCTL_SKIP_APK=1 says so out loud.
  needs: ["package:apk"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - test -n "$WANCTL_RELEASE_SIGNING_KEY" || { echo 'protected WANCTL_RELEASE_SIGNING_KEY is required' >&2; exit 1; }
    - test -n "$WANCTL_RELEASE_RSA_KEY" || { echo 'protected WANCTL_RELEASE_RSA_KEY is required' >&2; exit 1; }
    - ./scripts/build-release.sh "$CI_COMMIT_TAG"
  artifacts:
    name: "wanctl-$CI_COMMIT_TAG"
    paths: [release/]
    expire_in: never
  environment:
    name: release

# Deploy is manual and only offered on the production branch. Merging to main and
# shipping to production are separate decisions here: `deploy/v0.1.0` also carries
# the baked signed release bundle that /dl serves, so "what is on main" and "what
# devices download" are deliberately not the same thing. Auto-deploying on merge
# would erase that gap without anyone choosing to.
#
# Needs THUNDERBOX_TOKEN as a protected + masked project variable, and a runner
# with egress to the company-internal thunderbox API — the job says which of the
# two is missing rather than failing opaquely.
.deploy:
  extends: .go
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/v0.1.0"'
      when: manual
  variables:
    APP_REF: deploy/v0.1.0

deploy:relay:
  extends: .deploy
  environment:
    name: production/relay
    url: https://wanctl-relay.***REMOVED***.***REMOVED***.com
  script:
    # The manifest version is the one thing only the newly baked bundle can
    # report, so it proves the image that is serving, not just that one started.
    - ./scripts/deploy-thunderbox.sh ***REMOVED*** "$APP_REF"
        https://wanctl-relay.***REMOVED***.***REMOVED***.com/dl/manifest.json
        "$(sed -n 's/.*wanctl-\(v[0-9.]*\)-release.tar.gz.*/\1/p' Dockerfile | head -1)"

deploy:portal:
  extends: .deploy
  environment:
    name: production/portal
    url: https://wanctl.***REMOVED***.***REMOVED***.com
  script:
    # The portal sits behind SSO, so there is no body a runner can assert on;
    # this stops at "the platform reports it running" and says so.
    - ./scripts/deploy-thunderbox.sh ***REMOVED***6k0la0r3j93ktcrg0 "$APP_REF"
