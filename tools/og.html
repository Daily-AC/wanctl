<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 分享卡片：1200×630，跟片子的最后一帧同构 —— 字标、那句话、一条命令行。
     复用站点的 token 和 .cmdline，卡片和首屏那条复制是同一套 CSS。
     卡片自己的容器叫 .og，别跟站点的类名撞（撞过一次 .foot）。 */
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--canvas)}
  .og{height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .word{display:flex;align-items:center;gap:22px;font-size:112px;font-weight:600;letter-spacing:-2.4px;
        line-height:1;color:var(--ink)}
  .word svg{display:block;width:108px;height:108px;flex:none}
  .og h1{margin:46px 0 0;font-size:46px;line-height:1.1;letter-spacing:-.5px}
  .og .cmdline{margin-top:34px;border-radius:14px}
  .og .cmdline code{font-size:25px;padding:16px 30px}
  .og .cmdline b{font-weight:400;color:var(--blue)}
  .og .tag{margin-top:26px;font-size:20px;color:var(--ink-2);letter-spacing:-.2px}
</style></head>
<body>
<div class="og">
  <div class="word"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5.6 12.4 10.2 21.8 15.2 14.6 19.6 21.8 26.4 7.6" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/></svg>wanctl</div>
  <h1>Your machines. Your call.</h1>
  <div class="cmdline"><code>› Hand <b>wc.z10.dev</b> to your agent.</code></div>
  <div class="tag">Open source · Apache-2.0</div>
</div>
</body></html>
